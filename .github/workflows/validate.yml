name: Validate

# Checks repo.json with Mudrix's own validator (scripts/validate.mjs is generated from the Mudrix
# source, so it accepts and refuses exactly what Mudrix does), then that repo.json.sig is a valid
# signature of it. No dependencies are installed. Until you run "npm run init" it only warns.
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check that the repository is set up
        id: setup
        run: |
          if grep -q '"key": *"REPLACE_ME' repo.json; then
            echo "::warning::run npm run init"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Mudrix's checks
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/validate.mjs repo.json
      - name: Signature
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/sign.mjs verify repo.json
